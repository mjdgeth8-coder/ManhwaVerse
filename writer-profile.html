<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملف الكاتب</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">مانهوا ڤيرس</a>
        <nav class="nav-links"><a href="index.html">الرئيسية</a></nav>
        <button class="theme-toggle" onclick="document.documentElement.toggleAttribute('data-theme')">🌓</button>
    </header>

    <div class="container">
        <div style="text-align: center; margin-bottom: 2rem; background: var(--card-bg); padding: 2rem; border-radius: 12px; border: 1px solid var(--border-color);">
            <img src="https://via.placeholder.com/100" alt="صورة الكاتب" style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover; margin-bottom: 1rem; border: 2px solid var(--primary-color);">
            <h2>أحمد</h2>
            <p style="color: #888; font-size: 0.9rem; margin-top: 0.5rem;">كاتب معتمد في المنصة</p>
        </div>

        <h3>جميع قصص هذا الكاتب</h3>
        <div class="grid" style="margin-top: 1rem;">
            <div class="manga-card">
                <div class="verified-badge">✓</div>
                <a href="read.html"><img src="https://via.placeholder.com/200x280" alt="قصة"></a>
                <div class="manga-info">
                    <h3>أبطال الظل</h3>
                    <p style="font-size: 0.8rem; color: #888; margin-top: 0.3rem;">⭐ المتوسط: 2.9 | 👥 1,200 مقيّم</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
